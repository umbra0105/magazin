packages:
  - apps/*
  - packages/*

# Scripturi de build respinse explicit (binarele native vin prin pachete prebuilt)
allowBuilds:
  unrs-resolver: false
  # Prisma 7 (aprobat de utilizator): postinstall descarcă/pregătește motoarele CLI
  prisma: true
  "@prisma/engines": true
  esbuild: false
  # Optimizare nativă OPȚIONALĂ a msgpackr (adus de bullmq); fără ea msgpackr folosește fallback-ul JS.
  # Binarele prebuilt vin oricum prin pachetele @msgpackr-extract/*; scriptul de build rămâne respins.
  msgpackr-extract: false
