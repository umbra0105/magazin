name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: ecom
          POSTGRES_PASSWORD: ecom_ci
          POSTGRES_DB: ecom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecom -d ecom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.11
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # SMTP de test (1025) + API HTTP (8025): testele E2E cu email citesc mesajele de aici.
      mailpit:
        image: axllent/mailpit:v1.31.4
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Valori DOAR pentru CI (servicii efemere). Nu sunt secrete reale.
    env:
      APP_URL: http://localhost:3100
      APP_KEY: Y2ktb25seS1hcHAta2V5LTMyLWJ5dGVzLWxvbmctISE=
      DATABASE_URL: postgresql://ecom:ecom_ci@localhost:5432/ecom
      REDIS_URL: redis://localhost:6379
      # Testele de integrare rulează pe o bază și un DB Redis separate (aceleași ca local: ecom_test, DB 1).
      # Baza se creează și se migrează automat de globalSetup; refuză orice bază fără "test" în nume.
      TEST_DATABASE_URL: postgresql://ecom:ecom_ci@localhost:5432/ecom_test
      TEST_REDIS_URL: redis://localhost:6379/1
      STORAGE_DRIVER: local
      # MinIO din pasul de mai jos (S3 de test). Aplicația rulează cu storage local; variabilele
      # S3_* le citesc doar testele de storage. Bucketul de test se creează de test.
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: ecom
      S3_ACCESS_KEY_ID: ecom_minio
      S3_SECRET_ACCESS_KEY: ecom_minio_ci
      S3_FORCE_PATH_STYLE: "true"
      TEST_S3_BUCKET: ecom-test

    steps:
      - uses: actions/checkout@v4

      # Versiunea pnpm vine din câmpul `packageManager` din package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (pachete)
        run: pnpm lint

      - name: Lint (fișiere din rădăcină și e2e)
        run: pnpm lint:root

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Teste unitare
        run: pnpm test

      - name: Migrații DB (baza aplicației, pentru build și E2E)
        run: pnpm --filter @ecom/db db:deploy

      # MinIO nu poate fi în `services:` (acolo nu se poate da comanda `server /data`).
      # Aceeași imagine, fixată prin digest, ca în docker/docker-compose.dev.yml.
      - name: Pornește MinIO (storage S3 de test)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=ecom_minio \
            -e MINIO_ROOT_PASSWORD=ecom_minio_ci \
            cgr.dev/chainguard/minio@sha256:59667194421209c2c1eacbe761e24787e047985c5dfa96b15da9b59fe9b55cd0 \
            server /data
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/ready; then exit 0; fi
            sleep 2
          done
          docker logs minio
          exit 1

      - name: Teste de integrare (Postgres + Redis + MinIO)
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Instalează browserul Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Teste E2E
        run: pnpm test:e2e

      - name: Raport Playwright (la eșec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
