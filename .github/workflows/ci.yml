name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: ecom
          POSTGRES_PASSWORD: ecom_ci
          POSTGRES_DB: ecom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecom -d ecom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.11
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Valori DOAR pentru CI (servicii efemere). Nu sunt secrete reale.
    env:
      APP_URL: http://localhost:3100
      APP_KEY: Y2ktb25seS1hcHAta2V5LTMyLWJ5dGVzLWxvbmctISE=
      DATABASE_URL: postgresql://ecom:ecom_ci@localhost:5432/ecom
      REDIS_URL: redis://localhost:6379
      STORAGE_DRIVER: local

    steps:
      - uses: actions/checkout@v4

      # Versiunea pnpm vine din câmpul `packageManager` din package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (pachete)
        run: pnpm lint

      - name: Lint (fișiere din rădăcină și e2e)
        run: pnpm lint:root

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Teste unitare
        run: pnpm test

      - name: Migrații DB (Postgres de test)
        run: pnpm --filter @ecom/db db:deploy

      - name: Teste de integrare (Postgres + Redis)
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Instalează browserul Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Teste E2E
        run: pnpm test:e2e

      - name: Raport Playwright (la eșec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
